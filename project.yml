name: HarborIOS
options:
  bundleIdPrefix: com.hlyl
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  defaultConfig: Release
  generateEmptyDirectories: true
  xcodeVersion: "16.0"
configs:
  Debug: debug
  Release: release
packages:
  MPVKit:
    url: https://github.com/NuvioMedia/MPVKit.git
    branch: Nuvio
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    TARGETED_DEVICE_FAMILY: "1,2"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
targets:
  HarborIOS:
    type: application
    platform: iOS
    sources:
      - path: HarborIOS
        excludes:
          - "Info.plist"
      - path: Core
      - path: Data
      - path: Domain
      - path: Features
    dependencies:
      - package: MPVKit
        product: MPVKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hlyl.harborios
        PRODUCT_NAME: Harbor
        PRODUCT_MODULE_NAME: HarborIOS
        INFOPLIST_FILE: HarborIOS/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  HarborIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - HarborIOSTests
    dependencies:
      - target: HarborIOS
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Harbor.app/Harbor"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  HarborIOS:
    build:
      targets:
        HarborIOS: all
    test:
      targets:
        - HarborIOSTests
